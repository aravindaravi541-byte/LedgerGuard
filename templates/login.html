<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LedgerGuard Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="logo">🛡️ LedgerGuard</div>
        <h2>Welcome Back</h2>
        <p class="subtitle">Secure Multi-Tenant Billing System</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="/login">
            <label>Company / Tenant ID</label>
            <input type="text" name="tenant_id" placeholder="Enter Tenant ID" required>

            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Password</label>
            <div class="password-box">
                <input type="password" id="password" name="password" placeholder="Enter password" required>
                <span onclick="togglePassword()">Show</span>
            </div>

            <button type="submit">Login Securely</button>
        </form>

        <p class="footer">Protected by LedgerGuard Security</p>
    </div>

    <script>
        function togglePassword() {
            const pass = document.getElementById("password");
            pass.type = pass.type === "password" ? "text" : "password";
        }
    </script>
</body>
</html>
