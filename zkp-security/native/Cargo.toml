[package]
name = "ledgerguard-zkp-native"
version = "0.1.0"
edition = "2021"
autobenches = false

[lib]
name = "ledgerguard_zkp_native"
crate-type = ["rlib", "cdylib"]

[dependencies]
ark-bls12-381 = "0.5"
ark-ff = "0.5"
ark-groth16 = "0.5"
ark-r1cs-std = "0.5"
ark-relations = "0.5"
ark-serialize = "0.5"
ark-snark = "0.5"
pyo3 = { version = "0.24", features = ["extension-module"] }
ark-std = "0.5"
rand = "0.8"
sha2 = "0.10"

[dev-dependencies]

[[bin]]
name = "invoice-benchmark"
path = "benches/invoice.rs"
